<title>Signal Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eceef2; --surface:#fbfcfd; --surface-2:#f3f5f8; --ink:#131922; --ink-2:#4d5666; --muted:#747e8f;
  --rule:#d6dbe3; --rule-2:#e4e8ee; --focus:#2a78d6; --btn:#18202c; --btn-ink:#f5f7fa;
  --good:#1c7c43; --bad:#c23b3a; --map-empty:#e3e7ed; --map-edge:#fbfcfd;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#5598e7; --q4:#256abf; --q5:#104281;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --shadow:0 1px 0 rgba(20,26,35,.04), 0 1px 3px rgba(20,26,35,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1116; --surface:#161b22; --surface-2:#1d232c; --ink:#e7ebf1; --ink-2:#b3bcc9; --muted:#8a94a4;
    --rule:#2b323d; --rule-2:#232a33; --focus:#5598e7; --btn:#e7ebf1; --btn-ink:#10141a;
    --good:#4cc07c; --bad:#ec6d6c; --map-empty:#252c36; --map-edge:#161b22;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --q1:#1c3350; --q2:#1c5cab; --q3:#3987e5; --q4:#86b6ef; --q5:#cde2fb;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116; --surface:#161b22; --surface-2:#1d232c; --ink:#e7ebf1; --ink-2:#b3bcc9; --muted:#8a94a4;
  --rule:#2b323d; --rule-2:#232a33; --focus:#5598e7; --btn:#e7ebf1; --btn-ink:#10141a;
  --good:#4cc07c; --bad:#ec6d6c; --map-empty:#252c36; --map-edge:#161b22;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --q1:#1c3350; --q2:#1c5cab; --q3:#3987e5; --q4:#86b6ef; --q5:#cde2fb;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* Rail */
.rail{border-right:1px solid var(--rule);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.rail h2{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;padding:0 8px}
.boards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.boards button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline;color:var(--ink-2)}
.boards button:hover{background:var(--surface-2);color:var(--ink)}
.boards button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);outline:1px solid var(--rule-2)}
.boards .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.boards .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost{border:1px dashed var(--rule);background:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink-2);text-align:left}
.ghost:hover{border-color:var(--ink-2);color:var(--ink)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.mode{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:6px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}

/* Main */
main{padding-block:22px 64px;padding-inline:28px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.titlewrap{min-width:0;flex:1 1 320px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.btitle{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.2vw,36px);letter-spacing:-.02em;line-height:1.1;margin:4px 0 0;border:0;background:none;padding:2px 4px;margin-left:-4px;width:100%;border-radius:6px;text-wrap:balance}
.btitle:hover{background:var(--surface-2)}
.btitle:focus{background:var(--surface);outline:1px solid var(--rule)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.9}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.kbd{font-family:var(--mono);font-size:11px;opacity:.7}

.brief{background:var(--surface);border:1px solid var(--rule-2);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.brief h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.brief .body{grid-column:1/-1;max-width:78ch}
.brief .body ul{margin:6px 0;padding-left:18px}
.brief .body p{margin:6px 0}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{grid-column:span 4;background:var(--surface);border:1px solid var(--rule-2);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.card[data-span="6"]{grid-column:span 6}
.card[data-span="12"]{grid-column:span 12}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 4px}
.ctitle{font-weight:600;font-size:15px;line-height:1.3;margin:0;text-wrap:balance}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 7px;white-space:nowrap}
.cmeta{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn{border:0;background:none;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.cbody{padding:6px 16px 10px;flex:1;min-width:0}
.insight{margin:0 16px 12px;padding-top:10px;border-top:1px solid var(--rule-2);color:var(--ink-2);font-size:13px}
.insight b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-right:6px}
.cfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 16px 14px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.src{display:inline-flex;align-items:center;gap:4px;max-width:100%;border:1px solid var(--rule);border-radius:6px;padding:2px 7px;text-decoration:none;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src:hover{border-color:var(--ink-2);color:var(--ink)}

.menu{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:180px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--rule-2);margin:4px 0}
.menu .confirm{padding:8px 10px;font-size:13px;color:var(--ink-2)}

/* Stat */
.stat{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.stat .v{font-family:var(--display);font-weight:700;font-size:clamp(34px,4vw,48px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--ink-2);font-size:13px}
.delta{font-family:var(--mono);font-size:12px;display:inline-flex;gap:4px;align-items:center}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* Pie legend */
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pie svg{flex:none}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;flex:1 1 150px;min-width:0}
.legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.legend .vv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.legend .pc{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}

svg text{fill:var(--muted);font-family:var(--mono);font-size:10.5px}
svg .lbl{fill:var(--ink-2);font-family:var(--body);font-size:12px}
svg .val{fill:var(--ink);font-size:11px}
svg .grid line{stroke:var(--rule-2)}
svg .axis path{display:none}
svg .axis line{stroke:var(--rule)}

.maplegend{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.ramp{display:flex;gap:2px}
.ramp i{display:block;width:22px;height:8px;border-radius:2px}
.unmatched{font-size:11.5px;color:var(--muted);margin-top:4px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--rule-2);text-align:left}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl .bar{height:6px;border-radius:3px;background:var(--s1);opacity:.85}
.tblwrap{overflow-x:auto;max-height:320px;overflow-y:auto}

.note{font-size:14px;color:var(--ink);max-width:70ch}
.note h4{font-family:var(--display);font-size:16px;margin:8px 0 4px}
.note p{margin:6px 0}
.note ul{margin:6px 0;padding-left:18px}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.links a{display:flex;flex-direction:column;text-decoration:none;padding:8px 10px;border:1px solid var(--rule-2);border-radius:10px}
.links a:hover{border-color:var(--ink-2)}
.links .h{font-family:var(--mono);font-size:11px;color:var(--muted)}

.empty{grid-column:1/-1;border:1px dashed var(--rule);border-radius:14px;padding:40px 24px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--display);font-size:22px;margin:0 0 6px;color:var(--ink)}

/* Tooltip */
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;line-height:1.35;max-width:240px;opacity:0;transition:opacity .08s}
.tip b{font-family:var(--mono);font-weight:500}

/* Editor */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.42);display:grid;place-items:center;padding:16px}
.sheet{background:var(--bg);border:1px solid var(--rule);border-radius:16px;width:min(1080px,100%);max-height:calc(100% - 8px);overflow:auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.sheet .left{padding:20px 22px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--rule)}
.sheet .right{padding:20px 22px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.sheet h3{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{min-height:190px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.field textarea.short{min-height:70px;font-family:var(--body);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1 1 140px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.hint{font-size:12px;color:var(--muted)}
.drop{border:1px dashed var(--rule);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--focus);background:var(--surface)}
.ai{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:12.5px;color:var(--ink-2)}
.preview-card{grid-column:auto;box-shadow:none}
.sheet .foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;padding:14px 22px;border-top:1px solid var(--rule);background:var(--bg);position:sticky;bottom:0;flex-wrap:wrap}
.detected{font-family:var(--mono);font-size:11px;color:var(--muted)}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:70;font-size:13px;max-width:calc(100% - 32px)}

/* Attachments */
.atts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.att{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--rule-2);border-radius:10px;padding:6px 8px}
.att .ico{width:40px;height:40px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-2);overflow:hidden;text-transform:uppercase}
.att .ico img{width:100%;height:100%;object-fit:cover}
.att .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .st{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .st.err{color:var(--bad)}
.linkrow{display:flex;gap:6px}
.linkrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:7px 10px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.thumbs a{display:block;width:64px;height:48px;border-radius:7px;overflow:hidden;border:1px solid var(--rule-2);background:var(--surface-2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.filechip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:6px;padding:2px 7px;text-decoration:none;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip .t{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
a.filechip:hover{border-color:var(--ink-2);color:var(--ink)}
.media{display:flex;flex-direction:column;gap:10px}
.media .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.media .imgs a{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--rule-2);background:var(--surface-2);aspect-ratio:4/3;max-width:100%}
.media .imgs img{width:100%;height:100%;object-fit:contain;display:block}
.media .imgs.one{grid-template-columns:1fr}
.media .imgs.one a{aspect-ratio:auto;max-height:360px}
.media .doc{border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.media .doc .h{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.media .doc p{margin:0;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.dropping main{outline:2px dashed var(--focus);outline-offset:-10px;border-radius:16px}

@media (max-width:1100px){.card{grid-column:span 6}.card[data-span="12"]{grid-column:span 12}}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding:14px 16px;gap:10px}
  .boards{flex-direction:row;overflow-x:auto;gap:6px}
  .boards li{flex:none}
  .boards button{white-space:nowrap}
  .rail .foot{display:none}
  main{padding-inline:16px}
  .sheet{grid-template-columns:1fr}
  .sheet .left{border-right:0;border-bottom:1px solid var(--rule)}
}
@media (max-width:640px){.card,.card[data-span="6"]{grid-column:span 12}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="rail" aria-label="Dashboards">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="var(--btn)"/><rect x="6" y="13" width="3" height="7" rx="1.5" fill="var(--btn-ink)"/><rect x="11.5" y="9" width="3" height="11" rx="1.5" fill="var(--btn-ink)"/><rect x="17" y="6" width="3" height="14" rx="1.5" fill="var(--s2)"/></svg>
      <b>Signal Board</b>
    </div>
    <h2>Dashboards</h2>
    <ul class="boards" id="boards"></ul>
    <button class="ghost" id="newBoard" type="button">+ New dashboard</button>
    <div class="foot"><div class="mode" id="mode">Connecting…</div></div>
  </aside>
  <main>
    <div class="top">
      <div class="titlewrap">
        <div class="eyebrow"><span id="count">—</span><span id="updated"></span></div>
        <input class="btitle" id="btitle" aria-label="Dashboard name" value="">
      </div>
      <div class="actions">
        <button class="btn" id="briefBtn" type="button" hidden>Brief me</button>
        <button class="btn" id="boardMenuBtn" type="button" aria-label="Dashboard options">•••</button>
        <button class="btn primary" id="addCard" type="button">+ Add card</button>
      </div>
    </div>
    <section class="brief" id="brief" hidden aria-live="polite">
      <h3>Board brief</h3><button class="btn sm" id="briefClose" type="button">Hide</button>
      <div class="body" id="briefBody"></div>
    </section>
    <div class="grid" id="grid"></div>
  </main>
</div>
<div class="tip" id="tip" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const WORLD = /*__WORLD__*/null;
const USA = /*__US__*/null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
};

  const items = c.items || [];
  const stat = c.stat && isFinite(c.stat.value) ? c.stat : items.length ? {value: items[items.length - 1].value, label: items[items.length - 1].label} : null;
  if (!stat) { b.append(el("p", {class:"hint", text:"No number found yet."})); return; }
  const box = el("div", {class:"stat"}, el("div", {class:"v", text: fmt(stat.value, c.unit, true)}), stat.label ? el("div", {class:"l", text: stat.label}) : null);
  let delta = c.stat && c.stat.delta;
  if (!delta && items.length >= 2) {
    const a = items[items.length - 2].value, z = items[items.length - 1].value;
    if (a) { const pct = (z - a) / Math.abs(a) * 100; delta = (pct >= 0 ? "+" : "−") + Math.abs(pct).toFixed(1) + "% vs " + (items[items.length - 2].label || "previous"); }
  }
  if (delta) { const up = !/^[-−]/.test(delta.trim()); box.append(el("div", {class:"delta " + (up ? "up" : "down"), text: (up ? "▲ " : "▼ ") + delta.replace(/^[+\-−]\s?/, up ? "+" : "−")})); }
  b.append(box);
  if (items.length >= 3) {

    const x = d3.scaleLinear([0, items.length - 1], [3, w - 5]), y = d3.scaleLinear(d3.extent(items, d => d.value), [h, 4]).nice();

    svg.append("path").attr("d", d3.line().x((d, i) => x(i)).y(d => y(d.value)).curve(d3.curveMonotoneX)(items)).attr("fill", "none").attr("stroke", css("--s1")).attr("stroke-width", 2);

function drawPie(b, c, w) {

function drawBar(b, c, w) {

function drawLine(b, c, w) {

  lg.append("stop").attr("offset", 0).attr("stop-color", s1).attr("stop-opacity", .22); lg.append("stop").attr("offset", 1).attr("stop-color", s1).attr("stop-opacity", 0);
  svg.append("path").attr("d", d3.area().x((d, i) => x(i)).y0(y.range()[0]).y1(d => y(d.value)).curve(d3.curveMonotoneX)(items)).attr("fill", `url(#${grad})`);
  svg.append("path").attr("d", d3.line().x((d, i) => x(i)).y(d => y(d.value)).curve(d3.curveMonotoneX)(items)).attr("fill", "none").attr("stroke", s1).attr("stroke-width", 2);

  svg.append("text").attr("class", "val").attr("x", x(L) + 8).attr("y", y(items[L].value)).attr("dy", "0.35em").text(fmt(items[L].value, c.unit, true));
  const cross = svg.append("line").attr("stroke", css("--muted")).attr("stroke-dasharray", "2 3").attr("y1", m.t).attr("y2", h - m.b).attr("opacity", 0);
  const dot = svg.append("circle").attr("r", 4).attr("fill", s1).attr("stroke", css("--surface")).attr("stroke-width", 2).attr("opacity", 0);
  svg.append("rect").attr("x", m.l - 10).attr("width", w - m.l - m.r + 20).attr("y", 0).attr("height", h).attr("fill", "transparent")
    .on("mousemove", ev => { const [px] = d3.pointer(ev); let i = Math.round((px - m.l) / (x.step() || 1)); i = Math.max(0, Math.min(L, i)); cross.attr("x1", x(i)).attr("x2", x(i)).attr("opacity", 1); dot.attr("cx", x(i)).attr("cy", y(items[i].value)).attr("opacity", 1); showTip(ev, `${esc(items[i].label)}<br><b>${fmt(items[i].value, c.unit)}</b>`); })
    .on("mouseleave", () => { cross.attr("opacity", 0); dot.attr("opacity", 0); hideTip(); });

function drawMap(b, c, w) {
  const scope = c.scope === "us" ? "us" : "world";
  const items = c.items || [], points = c.points || [];
  const idx = scope === "us" ? usIndex : worldIndex, feats = scope === "us" ? usFeatures : worldFeatures;
  if (!feats.length) { b.append(el("p", {class:"hint", text:"Map shapes are unavailable in this view."})); return; }
  const vals = new Map(), missed = [];
  for (const it of items) { const f = idx.get(norm(it.label)); if (f) vals.set(f, (vals.get(f) || 0) + it.value); else if (it.label) missed.push(it.label); }
  const [lo, hi] = d3.extent([...vals.values()]);
  const rampCols = RAMP.map(css);
  const q = lo === undefined ? null : lo === hi ? () => rampCols[3] : d3.scaleQuantize([lo, hi], rampCols);
  const W = 960, H = scope === "us" ? 610 : 500;
  const svg = d3.select(b).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", "100%").style("display", "block").style("max-height", "440px").attr("role", "img").attr("aria-label", (scope === "us" ? "US" : "World") + " map with " + (vals.size || points.length) + " values");
  let path, proj;

  else { proj = d3.geoNaturalEarth1().fitExtent([[4, 4], [W - 4, H - 4]], {type: "Sphere"}); path = d3.geoPath(proj); }
  const shapes = scope === "us" ? feats : feats.filter(f => f.properties.name !== "Antarctica");
  svg.append("g").selectAll("path").data(shapes).join("path").attr("d", path)
    .attr("fill", f => vals.has(f) && q ? q(vals.get(f)) : css("--map-empty")).attr("stroke", css("--map-edge")).attr("stroke-width", scope === "us" ? 1 : 0.6)
    .on("mousemove", (ev, f) => showTip(ev, `${esc(f.properties.name)}<br><b>${vals.has(f) ? fmt(vals.get(f), c.unit) : "No data"}</b>`)).on("mouseleave", hideTip);
  if (points.length) {
    const pv = points.map(p => Math.abs(p.value || 1));
    const r = d3.scaleSqrt([0, d3.max(pv)], [0, scope === "us" ? 26 : 22]);
    svg.append("g").selectAll("circle").data(points.filter(p => proj([p.lon, p.lat]))).join("circle")
      .attr("cx", p => proj([p.lon, p.lat])[0]).attr("cy", p => proj([p.lon, p.lat])[1]).attr("r", p => Math.max(5, r(Math.abs(p.value || 1))))
      .attr("fill", css("--s2")).attr("fill-opacity", .78).attr("stroke", css("--surface")).attr("stroke-width", 2)
      .on("mousemove", (ev, p) => showTip(ev, `${esc(p.label || "Point")}<br><b>${fmt(p.value, c.unit)}</b>`)).on("mouseleave", hideTip);
  }
  if (q && lo !== hi) {
    const lgd = el("div", {class:"maplegend"}, el("span", {text: fmt(lo, c.unit, true)}), el("span", {class:"ramp"}, ...rampCols.map(col => el("i", {style:`background:${col}`}))), el("span", {text: fmt(hi, c.unit, true)}));
    b.append(lgd);
  }
  if (missed.length) b.append(el("p", {class:"unmatched", text: "Not on the map: " + missed.slice(0, 6).join(", ") + (missed.length > 6 ? " +" + (missed.length - 6) : "")}));
}

function drawTable(b, c) {

function md(text) {
  const box = el("div", {class:"note"});
  let list = null;
  const inline = s => { const span = el("span"); String(s).split(/(\*\*[^*]+\*\*)/g).forEach(part => { if (/^\*\*[^*]+\*\*$/.test(part)) span.append(el("strong", {text: part.slice(2, -2)})); else if (part) span.append(part); }); return span; };
  for (const raw of String(text || "").split(/\r?\n/)) {
    const l = raw.trim();
    if (!l) { list = null; continue; }
    if (/^#{1,4}\s/.test(l)) { list = null; box.append(el("h4", {}, inline(l.replace(/^#+\s*/, "")))); }
    else if (/^[-*•]\s+/.test(l)) { if (!list) { list = el("ul"); box.append(list); } list.append(el("li", {}, inline(l.replace(/^[-*•]\s+/, "")))); }
    else { list = null; box.append(el("p", {}, inline(l))); }
  }
  return box;
}
function drawNote(b, c) { if (c.note) b.append(md(c.note)); else if (!(c.sources || []).length) b.append(el("p", {class:"hint", text:"No notes yet."})); if ((c.sources || []).length && c.kind === "note") drawLinks(b, c); }

  b.append(ul);
}

let openMenu = null;

function popMenu(anchor, build) {

function cardMenu(e, c) {
  e.stopPropagation();
  const cards = boardCards(c.boardId), i = cards.findIndex(x => x.id === c.id);
  popMenu(e.currentTarget, m => {
    m.append(el("button", {type:"button", onclick: () => { closeMenu(); openEditor(c); }, text:"Edit card"}));
    const sizes = [[4, "Small"], [6, "Medium"], [12, "Full width"]];
    m.append(el("hr"));
    for (const [n, name] of sizes) m.append(el("button", {type:"button", onclick: () => { closeMenu(); guard(Data.setCard({...c, span: n, updatedAt: Date.now()})); }, text: (c.span || 4) === n ? "✓ " + name : name}));
    m.append(el("hr"));
    if (i > 0) m.append(el("button", {type:"button", onclick: () => { closeMenu(); swap(cards[i], cards[i - 1]); }, text:"Move earlier"}));
    if (i < cards.length - 1) m.append(el("button", {type:"button", onclick: () => { closeMenu(); swap(cards[i], cards[i + 1]); }, text:"Move later"}));
    m.append(el("button", {type:"button", onclick: () => { closeMenu(); guard(Data.setCard({...clone(c), id: uid("c"), title: (c.title || "Card") + " (copy)", order: (c.order ?? 0) + 0.5, createdAt: Date.now()})); }, text:"Duplicate"}));
    m.append(el("hr"));
    const del = el("button", {type:"button", class:"danger", style:"color:var(--bad)", text:"Delete card", onclick: ev => {
      ev.stopPropagation();
      del.replaceWith(el("div", {class:"confirm", text:"Delete “" + (c.title || "this card") + "”?"}), el("button", {type:"button", style:"color:var(--bad)", onclick: () => { closeMenu(); guard(Data.delCard(c.id)); }, text:"Yes, delete"}), el("button", {type:"button", onclick: closeMenu, text:"Keep it"}));
    }});
    m.append(del);
  });
}
const clone = o => JSON.parse(JSON.stringify(o));
async function swap(a, b) {
  const cards = boardCards(a.boardId);
  cards.forEach((c, i) => c._o = i * 10);
  const ao = a._o, bo = b._o;
  for (const c of cards) {
    const o = c === a ? bo : c === b ? ao : c._o;
    delete c._o;
    if ((c.order ?? null) !== o) { if (!(await guard(Data.setCard({...c, order: o})))) return; }
  }
}

    }});

});

/* ---------- Claude ---------- */
const KINDS = ["auto","stat","pie","bar","line","map","table","note","media"];
const KIND_LABEL = {auto:"Auto", stat:"Number", pie:"Pie", bar:"Bar", line:"Trend", map:"Map", table:"Table", note:"Notes", links:"Links", media:"Files"};
function interpretPrompt(material, title, imageNames = []) {
  return `You turn raw material into ONE dashboard card. The material may be pasted data (CSV, tables, lists), text extracted from uploaded documents (PDF, Word, Excel), research notes, URLs, and attached images such as photos, screenshots, scanned pages, charts or designs. You cannot open URLs: use only the text and images given. Only use numbers that appear in the material or are simple arithmetic on them. Never invent or estimate figures.

When an image shows a chart, table, receipt, statement or dashboard, read its values into "items" (or "stat"). When a document contains a data table, extract the most useful table. When there are several tables, pick the one that best answers what the card is about and mention the others in "note". If the material has no numbers, summarise it as a "note" card; if the files themselves are the point (photos, designs) with nothing to chart, use "media" and describe them in "note".

Pick "kind":
- "stat": one headline number (optionally a series in items for a sparkline, oldest first)
- "pie": parts of a whole, 2-7 positive parts
- "bar": comparing categories
- "line": values over time, oldest first
- "map": values per country or US state (labels must be country or state names), or points with lat/lon
- "table": many rows
- "note": qualitative findings
- "media": the attached files or images are the content

  }
  update();
  if (files && files.length) addFiles(files);

  async function gatherImages(max) {
    const out = [], names = [];
    for (const a of ED.atts) {
      if (a.error || out.length >= max) continue;
      let imgs = a.images;
      if (!imgs && a.assetId && (a.kind === "image" || a.kind === "svg")) {
        try { const r = await fetch(blobUrl(a.assetId)); if (r.ok) { const bl = await r.blob(); imgs = [a.kind === "svg" ? (await rasterize(new Blob([await bl.text()], {type: "image/svg+xml"}))).blob : bl]; } } catch {}
      }
      (imgs || []).forEach((im, i) => { if (out.length < max && im) { out.push(im); names.push(a.name + (a.kind === "pdf" ? " (page " + (i + 1) + ")" : "")); } });
    }
    return {out, names};
  }
  function material() {
    const parts = [];
    let budget = 45000;
    if (raw.value.trim()) { const t = raw.value.trim().slice(0, 15000); parts.push("PASTED BY THE USER:\n" + t); budget -= t.length; }
    const docs = ED.atts.filter(a => a.kind !== "link" && !a.error && a.text);
    for (const a of docs) {
      const share = Math.max(2000, Math.floor(budget / Math.max(1, docs.length)));
      parts.push("FILE: " + a.name + " (" + (a.summary || a.kind) + ")\n" + a.text.slice(0, share));
    }
    const links = ED.atts.filter(a => a.kind === "link");
    if (links.length) parts.push("LINKS (not opened):\n" + links.map(l => l.url).join("\n"));
    return parts.join("\n\n---\n\n");
  }

  aiBtn.addEventListener("click", async () => {
    if (ED.atts.some(a => a.status && !a.error)) { aiStatus.textContent = "Still reading your files. Try again in a moment."; return; }
    const hasFiles = ED.atts.some(a => a.kind !== "link" && !a.error);
    if (!raw.value.trim() && !hasFiles && !ED.atts.length) { aiStatus.textContent = "Add a file, a link, or paste some text first."; return; }
    ED.ctl = new AbortController();
    aiBtn.disabled = true; stopBtn.hidden = false; aiStatus.textContent = "Reading your material… (up to a minute)";
    try {
      const maxImg = S.limits?.images?.maxCount || 0;
      const {out: imgs, names} = maxImg ? await gatherImages(maxImg) : {out: [], names: []};
      const wantedImages = ED.atts.some(a => a.images?.length || a.kind === "image" || a.kind === "svg");
      const r = await S.sample.json(interpretPrompt(material(), title.value.trim(), names), imgs.length ? {signal: ED.ctl.signal, images: imgs} : {signal: ED.ctl.signal});
      if (!r || typeof r !== "object") throw {code: "invalid_json"};
      const items = Array.isArray(r.items) ? r.items.map(i => ({label: String(i.label ?? ""), value: Number(i.value)})).filter(i => isFinite(i.value)) : [];
      const points = Array.isArray(r.points) ? r.points.map(p => ({label: String(p.label ?? ""), lat: Number(p.lat), lon: Number(p.lon), value: Number(p.value ?? 1)})).filter(p => isFinite(p.lat) && isFinite(p.lon)) : [];
      const sources = Array.isArray(r.sources) ? r.sources.filter(s => s && /^https?:\/\//.test(s.url)).map(s => ({title: String(s.title || hostOf(s.url)), url: String(s.url)})) : [];
      const pl = parseInput(raw.value);
      for (const s of pl.sources) if (!sources.some(x => x.url === s.url)) sources.push(s);
      let kind = KINDS.includes(r.kind) || r.kind === "links" ? r.kind : items.length ? "bar" : "note";
      ED.ai = {kind, items, points, sources, unit: typeof r.unit === "string" ? r.unit.slice(0, 8) : "", scope: r.scope === "us" ? "us" : r.scope === "world" ? "world" : (kind === "map" ? geoMatch(items) || "world" : null),
        stat: r.stat && isFinite(Number(r.stat.value)) ? {value: Number(r.stat.value), label: String(r.stat.label || ""), delta: r.stat.delta ? String(r.stat.delta) : null} : null,
        note: typeof r.note === "string" ? r.note : "", insight: typeof r.insight === "string" ? r.insight : "", title: typeof r.title === "string" ? r.title : "", origin: "Read by Claude", fromClaude: true};
      if (!title.value.trim() || (ED.atts.length && title.value.trim() === (ED.atts.find(a => a.name)?.name || "").replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 80))) { if (ED.ai.title) title.value = ED.ai.title; }
      if (!insight.value.trim() && ED.ai.insight) insight.value = ED.ai.insight;
      ED.choice = "auto"; seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.k === "auto")));
      unitTouched = false; scopeTouched = false; unit.value = "";
      aiStatus.textContent = wantedImages && !imgs.length ? "Done, from the text only: images can't be sent to Claude in this view." : "Done. Check the preview, then save.";
      update();
    } catch (e) {
      aiStatus.textContent = e && e.code === "images_unavailable" ? "Images can't be sent to Claude in this view. Remove them or paste their text." : e && e.code === "image_rejected" ? "One of the images couldn't be sent. Try a smaller PNG or JPG." : sampleErr(e);
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { aiBtn.hidden = true; }
    } finally { aiBtn.disabled = false; stopBtn.hidden = true; }
  });
  stopBtn.addEventListener("click", () => ED?.ctl?.abort());

  saveBtn.addEventListener("click", async () => {
    if (ED.atts.some(a => a.status && !a.error)) { toast("Still reading your files. Save again in a moment."); return; }
    saveBtn.disabled = true;
    // store originals
    const pending = ED.atts.filter(a => a.upload && !a.assetId && !a.error);
    if (pending.length && S.assets) {
      saveBtn.textContent = "Uploading files…";
      let failed = 0;
      for (const a of pending) {
        try { const r = await S.assets.upload(a.upload, a.uploadType ? {type: a.uploadType} : (a.upload.type ? undefined : {type: "application/octet-stream"})); a.assetId = r.id; }
        catch (e) { failed++; console.warn(e); }
      }
      if (failed) toast(failed + " file" + (failed > 1 ? "s" : "") + " couldn't be stored. The extracted text is still saved.");
      saveBtn.textContent = card ? "Save card" : "Add to dashboard";
    }
    const c = build();
    const files = ED.atts.filter(a => a.kind !== "link" && !a.error).map(storedAtt);
    // keep the document well under the store's size limit
    let total = d3.sum(files, f => f.text.length);
    if (total > 120000) { const k = 120000 / total; for (const f of files) f.text = f.text.slice(0, Math.floor(f.text.length * k)); }
    const links = ED.atts.filter(a => a.kind === "link").map(a => ({aid: a.aid, url: a.url, name: a.name, summary: a.summary}));
    const out = {...draft, ...c, attachments: files, links, raw: raw.value, valueCol: ED.valueCol ?? null, fromClaude: !!ED.ai, updatedAt: Date.now()};
    if (!out.title) out.title = c.kind === "stat" && c.items?.[0]?.label ? c.items[0].label : files[0]?.name || "Untitled card";
    if (out.kind === "auto") out.kind = "note";
    for (const k of Object.keys(out)) if (out[k] === undefined) delete out[k];
    const ok = await guard(Data.setCard(JSON.parse(JSON.stringify(out))));
    saveBtn.disabled = false;
    if (ok) { ED.saved = true; closeEditor(); if (!card) toast("Card added"); }
  });
}

/* board-level drop and paste open a new card with the files */
const mainEl = document.querySelector("main");
mainEl.addEventListener("dragover", e => { if (!ED && currentBoard() && e.dataTransfer?.types?.includes("Files")) { e.preventDefault(); document.body.classList.add("dropping"); } });
mainEl.addEventListener("dragleave", e => { if (!mainEl.contains(e.relatedTarget)) document.body.classList.remove("dropping"); });
mainEl.addEventListener("drop", e => { document.body.classList.remove("dropping"); if (ED || !currentBoard()) return; const fs = [...(e.dataTransfer?.files || [])]; if (fs.length) { e.preventDefault(); openEditor(null, fs); } });
document.addEventListener("paste", e => {
  if (ED || !currentBoard()) return;
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const fs = [...(e.clipboardData?.files || [])];
  if (fs.length) { e.preventDefault(); openEditor(null, fs); }
});

/* ---------- boot ---------- */
S.current = store.get("sb.board");
render();
(async () => {
  const hasClaude = typeof window.claude !== "undefined" && window.claude && window.claude.use;
  const [db, sample, assets] = hasClaude ? await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("sample").catch(() => null), window.claude.use("assets").catch(() => null)]) : [null, null, null];
  S.sample = sample; S.assets = assets;
  S.limits = sample ? await sample.limits().catch(() => null) : null;
  if (db) {
    S.db = db;
    $("#mode").textContent = window.__standalone ? "Saved in this browser" : "Saved to this workspace";
    db.collection("boards").onSnapshot(snap => { S.boards = snap.docs.map(d => ({id: d.id, ...d.data()})); S.loaded.boards = true; render(); }, () => toast("Lost connection to saved dashboards. Reload to reconnect."));
    db.collection("cards").onSnapshot(snap => { S.cards = snap.docs.map(d => ({id: d.id, ...d.data()})); S.loaded.cards = true; if (!ED) render(); else S.pendingRender = true; }, () => {});
  } else {
    $("#mode").textContent = "Preview · changes are not saved";
    S.boards = [DEMO_BOARD];
    S.cards = [
      {id:"d1", boardId:"demo", title:"Example: monthly spending", kind:"pie", unit:"$", span:6, order:1, items:[{label:"Rent",value:1850},{label:"Groceries",value:620},{label:"Transport",value:210},{label:"Dining out",value:340},{label:"Utilities",value:180}], insight:"Example data. Rent is over half of the $3,200 total.", origin:"Example"},
      {id:"d2", boardId:"demo", title:"Example: savings balance", kind:"line", unit:"$", span:6, order:2, items:[{label:"Jan",value:4200},{label:"Feb",value:4650},{label:"Mar",value:4480},{label:"Apr",value:5120},{label:"May",value:5600},{label:"Jun",value:6010}], origin:"Example"},
      {id:"d3", boardId:"demo", title:"Example: customers by state", kind:"map", scope:"us", span:12, order:3, items:[{label:"CA",value:420},{label:"TX",value:310},{label:"NY",value:280},{label:"FL",value:190},{label:"IL",value:120},{label:"WA",value:95},{label:"GA",value:60}], origin:"Example"}
    ];
    render();
  }
})();
</script>
